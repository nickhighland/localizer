# Local development and non-Unraid hosts.
#
# On Unraid, use the template in unraid/ instead and give the container its own
# IP on br0 — the host's webGUI already owns port 80.
services:
  localizer:
    build: .
    container_name: localizer
    restart: unless-stopped
    # Host networking lets the container receive mDNS multicast and bind its
    # port directly. Use a macvlan network instead if port 80 is taken.
    network_mode: host
    environment:
      - HTTP_PORT=8088
      - CONFIG_DIR=/config
    volumes:
      - ./data:/config
      # Optional: lets "Refresh from Unraid" discover containers. Localizer only
      # reads from it, but anything holding the socket can control Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
